name: Desktop compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install missing Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists xkbcommon xcb xcb-render xcb-shape xcb-xfixes; then
            sudo apt-get update -qq
            sudo apt-get install -y libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
      - name: Build release
        run: cargo build --release --locked
      - name: Test tab input, file operations and recovery
        run: cargo test --release --locked --lib --test workspace --test tabs_ui --test clipboard_ui
