[package]
name = "branchline"
version = "0.1.0"
edition = "2024"

[dependencies]
clipboard-rs = { version = "0.3.5", default-features = false }
cssparser = "0.38.0"
directories = "6.0.0"
eframe = "0.37.0"
fs2 = "0.4.3"
html5ever = "0.40.1"
quick-xml = "0.42.0"
rfd = "0.17.2"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
